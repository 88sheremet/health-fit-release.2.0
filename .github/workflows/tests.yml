name: Tests

on:
  push:
    branches:
      - "**"

  pull_request:

jobs:
  unit-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: npm

      - name: Check Node.js version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Run Unit & Integration Tests
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    # The Supabase client needs a project URL/key at startup so the mocked
    # auth pages render, and e2e/helpers/supabase-mock.ts derives the
    # localStorage storage key (sb-<ref>-auth-token) from SUPABASE_URL so it
    # matches the key the app computes. Both the Nuxt dev server (started by
    # Playwright) and the Playwright test process inherit these env vars.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://nypmxuihlerrynxumpko.supabase.co' }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_S4I_uOzLAcxUwK8s4cDTPA_7ndfuIap' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: npm

      - name: Check Node.js version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7